<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JC EDU 마케팅 WBS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 로그인 화면 -->
<div class="login hidden" id="loginView">
  <form class="card" id="loginForm">
    <h1>JC EDU 마케팅 WBS</h1>
    <p>등록된 팀원 이메일로 로그인하세요.</p>
    <label for="loginEmail" class="msg">이메일</label>
    <input type="email" id="loginEmail" required autocomplete="email" placeholder="name@example.com">
    <label for="loginPw" class="msg">비밀번호 (관리자가 발급한 경우)</label>
    <input type="password" id="loginPw" autocomplete="current-password" placeholder="비워두면 로그인 링크를 메일로 받습니다">
    <button class="btn primary" type="submit" id="loginBtn">로그인</button>
    <div class="msg" id="loginMsg"></div>
  </form>
</div>

<!-- 권한 없음 -->
<div class="login hidden" id="deniedView">
  <div class="card">
    <h1>접근 권한이 없습니다</h1>
    <p id="deniedMsg">이 이메일은 팀원 목록에 등록되어 있지 않습니다. 관리자에게 등록을 요청하세요.</p>
    <button class="btn" type="button" id="deniedLogout">다른 이메일로 로그인</button>
  </div>
</div>

<!-- 앱 -->
<div class="app hidden" id="appView">
<header class="top">
  <div class="top-row">
    <div class="brand"><h1>JC EDU 마케팅 WBS</h1><span class="sub" id="todayLabel"></span></div>
    <div class="spacer"></div>
    <span class="sync" id="syncState">연결 중</span>
    <span class="who"><b id="meName"></b><span id="meRole"></span></span>
    <button class="btn hidden" id="staffBtn" type="button">담당자 관리</button>
    <button class="btn" id="logoutBtn" type="button">로그아웃</button>
    <button class="btn primary" id="xlsxBtn" type="button">엑셀 다운로드</button>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#dashboard" data-v="dashboard">업무 현황</a>
    <a href="#wbs" data-v="wbs">WBS<span class="n" id="nW"></span></a>
    <a href="#req" data-v="req">대표님 REQ<span class="n" id="nR"></span></a>
    <a href="#weekly" data-v="weekly">주간 보고</a>
    <a href="#gantt" data-v="gantt">간트</a>
  </nav>
</header>
<main>
  <section class="view" id="v-dashboard"></section>
  <section class="view" id="v-wbs"></section>
  <section class="view" id="v-req"></section>
  <section class="view" id="v-weekly"></section>
  <section class="view" id="v-gantt"></section>
</main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="업무 상세"></aside>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
