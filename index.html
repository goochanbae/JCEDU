<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JC EDU 마케팅 WBS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 로그인 · 회원가입 -->
<div class="login hidden" id="loginView">
  <form class="card" id="loginForm">
    <h1>JC EDU 마케팅 WBS</h1>
    <p>이메일과 비밀번호로 로그인하세요.</p>
    <label for="loginEmail" class="msg">이메일</label>
    <input type="email" id="loginEmail" required autocomplete="email" placeholder="name@example.com">
    <label for="loginPw" class="msg">비밀번호</label>
    <input type="password" id="loginPw" required autocomplete="current-password">
    <button class="btn primary" type="submit" id="loginBtn">로그인</button>
    <div class="msg" id="loginMsg"></div>
    <p class="msg">계정이 없나요? <button type="button" class="linkbtn" id="toSignup">회원가입</button></p>
  </form>
  <form class="card hidden" id="signupForm">
    <h1>회원가입</h1>
    <p>가입 후 관리자가 승인하면 사용할 수 있습니다.</p>
    <label for="suName" class="msg">이름</label>
    <input id="suName" required autocomplete="name" placeholder="홍길동">
    <label for="suEmail" class="msg">이메일</label>
    <input type="email" id="suEmail" required autocomplete="email" placeholder="name@example.com">
    <label for="suPw" class="msg">비밀번호 (8자 이상)</label>
    <input type="password" id="suPw" required minlength="8" autocomplete="new-password">
    <label for="suPw2" class="msg">비밀번호 확인</label>
    <input type="password" id="suPw2" required minlength="8" autocomplete="new-password">
    <button class="btn primary" type="submit" id="suBtn">가입 요청</button>
    <div class="msg" id="suMsg"></div>
    <p class="msg">이미 계정이 있나요? <button type="button" class="linkbtn" id="toLogin">로그인</button></p>
  </form>
</div>

<!-- 권한 없음 -->
<div class="login hidden" id="deniedView">
  <div class="card">
    <h1 id="deniedTitle">접근 권한이 없습니다</h1>
    <p id="deniedMsg">이 계정은 아직 승인되지 않았습니다.</p>
    <button class="btn primary hidden" type="button" id="deniedRetry">승인 여부 다시 확인</button>
    <button class="btn" type="button" id="deniedLogout">다른 계정으로 로그인</button>
  </div>
</div>

<!-- 앱 -->
<div class="app hidden" id="appView">
<header class="top">
  <div class="top-row">
    <div class="brand"><h1>JC EDU 마케팅 WBS</h1><span class="sub" id="todayLabel"></span></div>
    <div class="spacer"></div>
    <span class="sync" id="syncState">연결 중</span>
    <span class="who"><b id="meName"></b><span id="meRole"></span></span>
    <button class="btn bell" id="bellBtn" type="button" aria-label="알림">알림<span class="nbadge hidden" id="bellN"></span></button>
    <button class="btn" id="accountBtn" type="button">내 계정</button>
    <button class="btn" id="logoutBtn" type="button">로그아웃</button>
    <button class="btn primary" id="xlsxBtn" type="button">엑셀 다운로드</button>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#my" data-v="my">내 업무</a>
    <a href="#daily" data-v="daily">일일보고</a>
    <a href="#dashboard" data-v="dashboard">팀 현황</a>
    <a href="#wbs" data-v="wbs">WBS<span class="n" id="nW"></span></a>
    <a href="#req" data-v="req">대표님 REQ<span class="n" id="nR"></span></a>
    <a href="#weekly" data-v="weekly">주간 보고</a>
    <a href="#cal" data-v="cal">캘린더</a>
    <a href="#gantt" data-v="gantt">간트</a>
    <a href="#admin" data-v="admin" id="adminTab" class="hidden">관리자</a>
  </nav>
</header>
<main>
  <section class="view" id="v-my"></section>
  <section class="view" id="v-daily"></section>
  <section class="view" id="v-dashboard"></section>
  <section class="view" id="v-wbs"></section>
  <section class="view" id="v-req"></section>
  <section class="view" id="v-weekly"></section>
  <section class="view" id="v-cal"></section>
  <section class="view" id="v-gantt"></section>
  <section class="view" id="v-admin"></section>
</main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="업무 상세"></aside>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="config.js"></script>
<script src="daily_xlsx.js"></script>
<script src="app.js"></script>
</body>
</html>
